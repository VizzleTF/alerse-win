# Pull requests for new versions of the pinned actions, the stage action's npm
# packages and the submodules (arcomium and ungoogled-chromium-windows).
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /.github/actions/stage
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions-toolkit:
        patterns: ['@actions/*']

  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: chore
