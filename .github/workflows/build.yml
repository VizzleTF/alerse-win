    outputs:
      finished: ${{ steps.stage.outputs.finished }}
  complete:
    needs: build-16
    runs-on: ubuntu-latest
    steps:
      - name: Ensure the build finished
        run: |
          if [ "${{ needs.build-16.outputs.finished }}" != "true" ]; then
            echo "The build did not finish in 16 stages."
            exit 1
          fi
