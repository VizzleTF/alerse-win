# Builds Arcomium for Windows (x64 and arm64). A tag vMAJOR.MINOR.PATCH also
# publishes a GitHub Release: each architecture's installer and portable zip are
# added as soon as that architecture is built, so x64 does not wait for arm64,
# and one that fails does not hold back the other. A manual run only builds,
# and its packages are kept as workflow artifacts for 4 days.
name: release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Checks the tag against arcomium/VERSION before two days of building.
  version:
    runs-on: ubuntu-latest
    outputs:
      arcomium: ${{ steps.version.outputs.arcomium }}
      chromium: ${{ steps.version.outputs.chromium }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { submodules: recursive }
      - id: version
        run: bash .github/scripts/release-version.sh ungoogled-chromium-windows/ungoogled-chromium/chromium_version.txt

  x64:
    needs: version
    uses: ./.github/workflows/build.yml

  arm64:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      arm: true

  publish-x64:
    needs: [version, x64]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      arch: x64
      arcomium: ${{ needs.version.outputs.arcomium }}
      chromium: ${{ needs.version.outputs.chromium }}

  publish-arm64:
    needs: [version, arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      arch: arm64
      arcomium: ${{ needs.version.outputs.arcomium }}
      chromium: ${{ needs.version.outputs.chromium }}
